<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>Avaliar filme - CineBox</title>

</head>

<body>

    <header class="header">

        <div class="logo">
            🎬 CineBox
        </div>

        <a href="index.html">
            ← Voltar
        </a>

    </header>


    <main class="form-container">

        <div class="form-card">

            <h2>
                Avaliar filme
            </h2>


            <form id="avaliarForm">


                <label>
                    Nome do filme
                </label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Ex: Interestelar"
                    required
                >


                <label>
                    Ano
                </label>

                <input
                    type="number"
                    id="ano"
                    placeholder="2014"
                >


                <label>
                    Gênero
                </label>

                <input
                    type="text"
                    id="genero"
                    placeholder="Ficção científica"
                >


                <label>
                    URL do pôster
                </label>

                <input
                    type="url"
                    id="poster"
                    placeholder="https://..."
                >


                <label>
                    Nota
                </label>

                <select id="nota">

                    <option value="0">
                        0 ⭐
                    </option>

                    <option value="0.5">
                        0.5 ⭐
                    </option>

                    <option value="1">
                        1 ⭐
                    </option>

                    <option value="1.5">
                        1.5 ⭐
                    </option>

                    <option value="2">
                        2 ⭐
                    </option>

                    <option value="2.5">
                        2.5 ⭐
                    </option>

                    <option value="3">
                        3 ⭐
                    </option>

                    <option value="3.5">
                        3.5 ⭐
                    </option>

                    <option value="4">
                        4 ⭐
                    </option>

                    <option value="4.5">
                        4.5 ⭐
                    </option>

                    <option value="5">
                        5 ⭐
                    </option>

                </select>


                <label>
                    Data em que assistiu
                </label>

                <input
                    type="date"
                    id="data"
                >


                <label>
                    Minha avaliação
                </label>

                <textarea
                    id="comentario"
                    rows="6"
                    placeholder="O que você achou do filme?"
                ></textarea>


                <button
                    type="submit"
                    class="botao"                >
                    Salvar avaliação
                </button>
            </form>
        </div>
    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js"></script>

    <script src="avaliar.js"></script>

</body>

</html>
