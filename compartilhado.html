<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">

    <link rel="stylesheet" href="./style.css">

    <title>CineBox - Avaliações Compartilhadas</title>
</head>

<body>

    <header class="header">

        <div class="logo">
            🎬 CineBox
        </div>

        <div class="pwa-instalacao" style="margin-bottom: 20px; display: flex; gap: 10px;">

            <button
                id="btnInstalarVisualizador"
                style="display: none; background: #ffffff; color: #111;">
                📲 Baixar App
            </button>

        </div>

    </header>


    <main class="container">

        <section class="topo">

            <div>

                <h2>Lista Compartilhada</h2>

                <p>
                    Confira estas indicações de filmes!
                </p>

            </div>

        </section>


        <!-- Filmes compartilhados -->

        <section
            id="filmesCompartilhadosContainer"
            class="filmes-grid">

        </section>

    </main>


    <!-- ==========================================
         SUPABASE
         ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./supabase.js"></script>


    <!-- ==========================================
         PWA
         ========================================== -->

    <script>

        let deferredPrompt = null;

        const btnVisualizador =
            document.getElementById("btnInstalarVisualizador");


        function checkDisplayMode() {

            const isStandalone =
                window.matchMedia("(display-mode: standalone)").matches ||
                window.navigator.standalone ||
                document.referrer.includes("android-app://");


            if (isStandalone) {

                if (btnVisualizador) {
                    btnVisualizador.style.display = "none";
                }

            } else {

                if (btnVisualizador && deferredPrompt) {
                    btnVisualizador.style.display = "inline-block";
                }

            }

        }


        window.addEventListener(
            "beforeinstallprompt",
            function (event) {

                event.preventDefault();

                deferredPrompt = event;

                checkDisplayMode();

            }
        );


        if (btnVisualizador) {

            btnVisualizador.addEventListener(
                "click",
                async function () {

                    if (!deferredPrompt) {
                        return;
                    }

                    deferredPrompt.prompt();

                    const { outcome } =
                        await deferredPrompt.userChoice;

                    console.log(
                        "Instalação:",
                        outcome
                    );

                    deferredPrompt = null;

                    btnVisualizador.style.display = "none";

                }
            );

        }


        window.addEventListener(
            "DOMContentLoaded",
            checkDisplayMode
        );

    </script>


    <!-- ==========================================
         CARREGAR FILMES COMPARTILHADOS
         ========================================== -->

    <script>

        async function carregarFilmesCompartilhados() {

            const container =
                document.getElementById(
                    "filmesCompartilhadosContainer"
                );


            if (!container) {
                console.error(
                    "Container de filmes não encontrado."
                );
                return;
            }


            container.innerHTML =
                "<p>Carregando lista...</p>";


            // Pega os IDs da URL

            const urlParams =
                new URLSearchParams(
                    window.location.search
                );

            const idsString =
                urlParams.get("ids");


            // Se não tiver IDs

            if (!idsString) {

                container.innerHTML =
                    "<p>Nenhum filme compartilhado nesta lista.</p>";

                return;

            }


            // Exemplo:
            // ?ids=4,2,1

            const listaIds =
                idsString
                    .split(",")
                    .map(id => id.trim())
                    .filter(id => id !== "");


            if (listaIds.length === 0) {

                container.innerHTML =
                    "<p>Nenhum filme válido foi encontrado.</p>";

                return;

            }


            try {

                console.log(
                    "IDs recebidos:",
                    listaIds
                );


                // ==========================================
                // 1. BUSCAR AVALIAÇÕES
                // ==========================================

                const {
                    data: avaliacoes,
                    error: errorAvaliacoes
                } = await supabaseClient

                    .from("avaliacoes")

                    .select(
                        "id, filme_id, nota, comentario"
                    )

                    .in(
                        "id",
                        listaIds
                    );


                if (errorAvaliacoes) {
                    throw errorAvaliacoes;
                }


                console.log(
                    "Avaliações encontradas:",
                    avaliacoes
                );


                if (
                    !avaliacoes ||
                    avaliacoes.length === 0
                ) {

                    container.innerHTML =
                        "<p>Nenhuma avaliação correspondente foi encontrada.</p>";

                    return;

                }


                // ==========================================
                // 2. PEGAR OS IDs DOS FILMES
                // ==========================================

                const filmeIds =
                    avaliacoes

                        .map(
                            avaliacao =>
                                avaliacao.filme_id
                        )

                        .filter(
                            id =>
                                id !== null &&
                                id !== undefined
                        );


                if (filmeIds.length === 0) {

                    container.innerHTML =
                        "<p>As avaliações não possuem filmes associados.</p>";

                    return;

                }


                console.log(
                    "IDs dos filmes:",
                    filmeIds
                );


                // ==========================================
                // 3. BUSCAR FILMES
                // ==========================================

                const {
                    data: filmes,
                    error: errorFilmes
                } = await supabaseClient

                    .from("filmes")

                    .select("*")

                    .in(
                        "id",
                        filmeIds
                    );


                if (errorFilmes) {
                    throw errorFilmes;
                }


                console.log(
                    "Filmes encontrados:",
                    filmes
                );


                container.innerHTML = "";


                // ==========================================
                // 4. CRIAR CARDS
                // ==========================================

                avaliacoes.forEach(
                    function (item) {

                        const filme =
                            filmes.find(
                                function (f) {

                                    return String(f.id) ===
                                        String(item.filme_id);

                                }
                            );


                        if (!filme) {
                            return;
                        }


                        // Tenta encontrar a imagem

                        const urlImagem =
                            filme.poster_url ||
                            filme.imagem_url ||
                            filme.poster ||
                            "https://via.placeholder.com/300x450?text=Sem+Poster";


                        // Cria card

                        const card =
                            document.createElement(
                                "article"
                            );


                        card.className =
                            "filme-card";


                        card.innerHTML = `

                            <img
                                src="${urlImagem}"
                                alt="${filme.titulo || "Filme"}"
                                onerror="this.src='https://via.placeholder.com/300x450?text=Sem+Poster'"
                            >

                            <div class="filme-info">

                                <h3>
                                    ${filme.titulo || "Título Indisponível"}
                                </h3>

                                ${
                                    filme.ano
                                        ? `<p>${filme.ano}</p>`
                                        : ""
                                }

                                <p class="nota">
                                    ⭐ ${item.nota}
                                </p>

                                ${
                                    item.comentario
                                        ? `
                                            <p class="comentario">
                                                "${item.comentario}"
                                            </p>
                                        `
                                        : ""
                                }

                            </div>

                        `;


                        container.appendChild(
                            card
                        );

                    }
                );


                // ==========================================
                // 5. NENHUM CARD GERADO
                // ==========================================

                if (
                    container.children.length === 0
                ) {

                    container.innerHTML =
                        "<p>Os filmes indicados não foram encontrados no banco de dados.</p>";

                }


            } catch (error) {

                console.error(
                    "Erro detalhado do Supabase:",
                    error
                );


                container.innerHTML =
                    "<p>Erro ao carregar a lista. Verifique a conexão com o banco de dados.</p>";

            }

        }


        // Executa UMA vez

        carregarFilmesCompartilhados();

    </script>

</body>

</html>
```
